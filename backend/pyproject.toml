[project]
name = "spikeai-backend"
version = "0.1.0"
description = "SpikeAI / Narratium 叙梦 Naro 1:1 复刻全栈系统异步后端"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis[hiredis]>=5.2.0",
    "pillow>=11.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.18",
    "httpx>=0.28.0",
    "email-validator>=2.3.0",
    "minio>=7.2.20",
    "pyahocorasick>=2.3.1",
    "pgvector>=0.5.0",
    "edge-tts>=7.2.8",
    "regex>=2026.9.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "pytest-cov>=7.1.0",
    "aiosqlite>=0.22.1",
    "paramiko>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "dump_*.py",
    "parse_*.py",
    "analyze_*.py",
    "inspect_*.py",
]

[tool.ruff.lint]
ignore = ["UP046", "B008", "BLE001"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
