version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: spikeai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spikeai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spikeai_password}
      POSTGRES_DB: ${POSTGRES_DB:-spikeai_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spikeai} -d ${POSTGRES_DB:-spikeai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: spikeai-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-spikeai_redis_pass}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-spikeai_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: spikeai_postgres_data
  redis_data:
    name: spikeai_redis_data
