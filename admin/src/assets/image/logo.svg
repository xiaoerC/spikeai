<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="spikeGold" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCEEAC"/>
      <stop offset="30%" stop-color="#E5C158"/>
      <stop offset="70%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#8F6B12"/>
    </linearGradient>
    <linearGradient id="spikeDark" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E2028"/>
      <stop offset="100%" stop-color="#0E0F14"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 外框圆角矩形 -->
  <rect width="128" height="128" rx="28" fill="url(#spikeDark)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" stroke="url(#spikeGold)" stroke-width="2" stroke-opacity="0.35"/>

  <!-- SpikeAI 核心几何星芒晶体 -->
  <g filter="url(#goldGlow)">
    <!-- 顶部尖芒 -->
    <path d="M64 18 L76 52 L64 46 L52 52 Z" fill="url(#spikeGold)"/>
    <!-- 右侧尖芒 -->
    <path d="M110 64 L76 76 L82 64 L76 52 Z" fill="url(#spikeGold)"/>
    <!-- 底部尖芒 -->
    <path d="M64 110 L52 76 L64 82 L76 76 Z" fill="url(#spikeGold)"/>
    <!-- 左侧尖芒 -->
    <path d="M18 64 L52 52 L46 64 L52 76 Z" fill="url(#spikeGold)"/>
    <!-- 中央核心钻石晶体 -->
    <polygon points="64,36 92,64 64,92 36,64" fill="url(#spikeGold)" fill-opacity="0.95"/>
    <polygon points="64,48 80,64 64,80 48,64" fill="#FFFFFF" fill-opacity="0.4"/>
  </g>
</svg>
