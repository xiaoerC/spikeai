  <style>
    .hz-status-shell{position:relative;isolation:isolate;margin:1.2rem .35rem .55rem;padding:14px 18px;color:#30281f;font-family:"Noto Serif SC","Songti SC","STSong",serif;filter:drop-shadow(0 11px 12px rgba(34,21,10,.25))}
    .hz-status-shell::before,.hz-status-shell::after{content:"";position:absolute;z-index:4;left:10px;right:10px;height:18px;border:1px solid #321c0f;border-radius:8px;background:linear-gradient(#9c6837,#4c2b17 45%,#8a552b 53%,#2d180d);box-shadow:inset 0 0 0 2px rgba(227,172,96,.11),0 3px 6px rgba(31,17,8,.32)}.hz-status-shell::before{top:0}.hz-status-shell::after{bottom:0;transform:scaleY(-1)}
    .hz-status-scroll{position:relative;overflow:hidden;border-inline:1px solid rgba(84,54,29,.48);background-color:#d8c39b;background-image:linear-gradient(rgba(244,232,201,.7),rgba(217,193,148,.6)),var(--hz-paper);background-size:cover;box-shadow:inset 0 0 34px rgba(82,50,22,.2)}
    .hz-status-scroll::before{content:"";position:absolute;inset:0;background-image:var(--hz-map);background-size:cover;background-position:center;mix-blend-mode:multiply;opacity:.1;pointer-events:none}
    .hz-status-head{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.82rem 1rem .72rem;border-bottom:1px dashed rgba(83,53,28,.38)}
    .hz-identity-plaque{display:flex;align-items:center;gap:.68rem}.hz-identity-plaque::before{content:"忍";display:grid;place-items:center;width:2.45rem;height:2.45rem;border:2px solid rgba(128,43,33,.7);border-radius:50%;color:#852e26;font-size:1.05rem;font-weight:900;transform:rotate(-5deg);box-shadow:inset 0 0 0 3px rgba(142,47,37,.1)}
    .hz-title-stack{display:grid;gap:.1rem}.hz-status-title{color:#2c2219;font-size:.92rem;font-weight:900;letter-spacing:.16em}.hz-status-subtitle{color:#756047;font-size:.62rem;letter-spacing:.1em}
    .hz-file-mark{padding:.25rem .45rem;border:1px solid rgba(87,56,31,.32);color:#684a30;font-size:.6rem;letter-spacing:.15em;transform:rotate(2deg);background:rgba(242,226,190,.42)}
    .hz-status-tabs{position:relative;z-index:2;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.38rem;padding:.55rem .75rem 0}
    .hz-status-tab{position:relative;appearance:none;border:1px solid rgba(76,47,26,.36);border-bottom:0;border-radius:7px 7px 0 0;padding:.46rem .25rem .42rem;color:#5e4934;background:linear-gradient(rgba(225,204,163,.94),rgba(194,164,116,.88));font:700 .7rem/1.2 inherit;cursor:pointer;box-shadow:0 -2px 4px rgba(55,33,16,.08);transition:transform .16s,filter .16s,color .16s}
    .hz-tab-sigil{display:inline-grid;place-items:center;width:1.65rem;height:1.65rem;margin-right:.32rem;border:1.5px solid currentColor;border-radius:50%;font-size:.74rem;vertical-align:middle;transform:rotate(-4deg);background:rgba(255,244,214,.2)}.hz-icon{width:1rem;height:1rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.hz-tab-kanji{position:absolute;right:-.18rem;bottom:-.22rem;display:grid;place-items:center;width:.72rem;height:.72rem;border-radius:50%;color:#f2dfb1;background:#76513a;font-size:.45rem;line-height:1}.hz-tab-label{vertical-align:middle}.hz-ink-spread{position:absolute;inset:50% auto auto 50%;width:0;height:0;border-radius:50%;background:rgba(109,41,31,.13);transform:translate(-50%,-50%);transition:width .22s,height .22s;pointer-events:none}
    .hz-status-tab:hover,.hz-status-tab:focus-visible{filter:brightness(1.05);transform:translateY(-2px);outline:1px dashed rgba(128,43,33,.55);outline-offset:-4px}.hz-status-tab[aria-selected="true"]{z-index:2;color:#842e25;background:linear-gradient(#ead8ad,#d8bc83);transform:translateY(-3px);box-shadow:0 -4px 8px rgba(64,37,17,.12)}.hz-status-tab[aria-selected="true"] .hz-ink-spread{width:82%;height:72%}
    .hz-status-body{position:relative;z-index:1;padding:.9rem 1rem 1rem;border-top:1px solid rgba(78,48,25,.34)}.hz-status-panel[hidden]{display:none}.hz-status-panel{display:grid;gap:.66rem}
    .hz-section-bar{display:flex;align-items:center;gap:.48rem;min-height:1.75rem;padding:.28rem .55rem;color:#4a3828;border-block:1px solid rgba(76,48,27,.24);background:linear-gradient(90deg,rgba(113,70,39,.18),rgba(236,217,177,.28) 52%,transparent);font-size:.7rem;font-weight:900;letter-spacing:.12em}.hz-section-bar::after{content:"";flex:1;height:1px;margin-left:.2rem;background:linear-gradient(90deg,rgba(121,43,34,.42),transparent)}.hz-section-icon{display:grid;place-items:center;width:1.35rem;height:1.35rem;border:1px solid rgba(126,43,34,.62);border-radius:50%;color:#842e25;background:rgba(142,47,37,.07);font-size:.62rem;transform:rotate(-5deg)}.hz-section-count{order:3;min-width:1.25rem;padding:.08rem .35rem;border-radius:999px;color:#f0dfb8;background:#6b4b32;font:700 .58rem/1.35 sans-serif;text-align:center;letter-spacing:0}
    .hz-summary-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.45rem}.hz-kv-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.55rem}.hz-kv{position:relative;min-width:0;padding:.65rem .72rem;border:1px solid rgba(85,55,31,.25);background:rgba(244,230,197,.4);box-shadow:inset 0 0 10px rgba(100,65,33,.06)}
    .hz-vital-seal{padding-left:3.45rem;min-height:2.35rem}.hz-vital-seal::before{content:"";position:absolute;left:.58rem;top:50%;width:2.1rem;height:2.1rem;border:1px solid rgba(71,50,36,.55);border-radius:50%;transform:translateY(-50%);background:repeating-conic-gradient(from 12deg,rgba(67,48,34,.45) 0 2deg,transparent 2deg 44deg)}.hz-vital-seal[data-vital="chakra"]::before{border-color:#496c78;background:repeating-conic-gradient(from 12deg,rgba(55,99,115,.5) 0 2deg,transparent 2deg 44deg)}
    .hz-label{display:block;margin-bottom:.2rem;color:#765d42;font-size:.62rem;font-weight:800;letter-spacing:.1em}.hz-value{display:block;color:#2c241c;font-size:.84rem;font-weight:700;line-height:1.5;overflow-wrap:anywhere}
    .hz-vitals-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.58rem}.hz-meter-card{position:relative;min-width:0;padding:.72rem .78rem;border:1px solid rgba(79,51,29,.28);background:linear-gradient(135deg,rgba(249,236,205,.48),rgba(214,188,139,.3));box-shadow:inset 0 0 14px rgba(79,50,24,.07)}.hz-meter-head{display:flex;align-items:center;justify-content:space-between;gap:.55rem;margin-bottom:.42rem}.hz-meter-title{display:flex;align-items:center;gap:.38rem;color:#3d3024;font-size:.72rem;font-weight:900;letter-spacing:.08em}.hz-meter-title::before{content:"";width:.45rem;height:.45rem;border:1px solid currentColor;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}.hz-meter-value{color:#654d37;font:700 .66rem/1.2 sans-serif}.hz-meter{position:relative;height:.65rem;overflow:hidden;border:1px solid rgba(55,39,27,.38);border-radius:999px;background:rgba(63,45,32,.2);box-shadow:inset 0 2px 4px rgba(44,30,20,.2)}.hz-meter::after{content:"";position:absolute;inset:1px;background:repeating-linear-gradient(90deg,transparent 0 calc(20% - 1px),rgba(255,246,220,.26) calc(20% - 1px) 20%);pointer-events:none}.hz-meter-fill{position:absolute;inset-block:0;left:0;width:0;border-radius:inherit;transition:width .55s ease;box-shadow:inset 0 1px rgba(255,255,255,.3)}[data-meter="stamina"] .hz-meter-fill{background:linear-gradient(90deg,#6b7f48,#a59b4b,#b27638)}[data-meter="chakra"] .hz-meter-fill{background:linear-gradient(90deg,#315d70,#4f91a9,#8ac5cf)}.hz-meter-card.is-sealed .hz-meter{background:repeating-linear-gradient(135deg,rgba(66,53,42,.2) 0 5px,rgba(239,221,184,.2) 5px 10px)}.hz-meter-card.is-sealed .hz-meter-fill{display:none}.hz-meter-foot{display:flex;justify-content:space-between;gap:.5rem;margin-top:.3rem;color:#79624a;font-size:.61rem}.hz-meter-stage{font-weight:800}.hz-meter-seal{color:#842e25;letter-spacing:.12em}
    .hz-card-list{display:grid;gap:.58rem}.hz-card{position:relative;padding:.7rem .75rem .7rem .9rem;border-left:3px solid rgba(101,62,32,.62);background:rgba(241,224,187,.42);box-shadow:inset 0 -1px rgba(86,54,30,.12)}
    .hz-card::after{content:"録";position:absolute;right:.5rem;bottom:.2rem;color:rgba(124,45,35,.08);font-size:1.35rem;font-weight:900;transform:rotate(-8deg)}.hz-card[data-tone="完成"]{border-left-color:#62794b}.hz-card[data-tone="失败"],.hz-card[data-tone="敌对"]{border-left-color:#8f342c}.hz-card-top{display:flex;align-items:baseline;justify-content:space-between;gap:.7rem}.hz-card-name{color:#2d241b;font-size:.86rem;font-weight:800;line-height:1.4}.hz-card-meta{flex:0 0 auto;padding:.1rem .35rem;border:1px solid rgba(128,75,42,.2);color:#80512f;background:rgba(245,226,185,.32);font-size:.66rem}.hz-card-desc{margin-top:.3rem;color:#604e3a;font-size:.76rem;line-height:1.55;overflow-wrap:anywhere}.hz-card-note{margin-top:.28rem;color:#7d6549;font-size:.68rem;line-height:1.5}

    .hz-chip-row{display:flex;flex-wrap:wrap;gap:.4rem}.hz-chip{display:inline-flex;padding:.32rem .55rem;border:1px solid rgba(132,45,36,.36);color:#812f28;background:rgba(151,52,40,.06);font-size:.68rem;font-weight:700;transform:rotate(-1deg)}.hz-chip:nth-child(even){transform:rotate(1deg)}

            if (raw && hasState(raw.data)) return raw.data;
            if (hasState(raw)) return raw;
          }
        } catch (error) { /* retry while MVU attaches the floor snapshot */ }
        if (attempt + 1 < readAttempts) await delay(150);
      }
      return {stat_data: DEFAULT_STAT_DATA, display_data: DEFAULT_STAT_DATA, fallback_seed: true};
    };

    root.querySelectorAll('[data-tab]').forEach(button => {
      button.addEventListener('click', () => {
        const selected = button.dataset.tab;
        root.querySelectorAll('[data-tab]').forEach(candidate => candidate.setAttribute('aria-selected', candidate === button ? 'true' : 'false'));
        root.querySelectorAll('[data-panel]').forEach(candidate => { candidate.hidden = candidate.dataset.panel !== selected; });
      });
    });

    try {
      const payload = await readPayload();
      const stat = payload.stat_data || payload.display_data || payload;
      const display = payload.display_data || stat;

      const basic = panel('basic');
      basic.replaceChildren();
      appendSection(basic, '人', '身份摘要');
      const grid = make('div', 'hz-summary-strip');
      appendKv(grid, '身体年龄', currentValue(display, stat, ['玩家', '基础', '身体年龄']));
      appendKv(grid, '身份', currentValue(display, stat, ['玩家', '基础', '身份']));
      appendKv(grid, '阵营', currentValue(display, stat, ['玩家', '基础', '阵营']));
      appendKv(grid, '剧情阶段', currentValue(display, stat, ['世界', '剧情', '阶段标记'], '未知'));
      basic.append(grid);

      appendSection(basic, '脉', '体能与查克拉');
      const vitals = make('div', 'hz-vitals-grid');
      const staminaCurrent = unwrap(safeGet(stat, ['玩家', '基础', '体力当前']), 0);
      const staminaMaximum = unwrap(safeGet(stat, ['玩家', '基础', '体力上限']), 100);
      appendVitalMeter(vitals, {kind: 'stamina', label: '体力', current: staminaCurrent, maximum: staminaMaximum, stage: staminaStage(staminaCurrent, staminaMaximum)});
      const chakraCurrent = unwrap(safeGet(stat, ['玩家', '基础', '查克拉当前']), 0);
      const chakraMaximum = unwrap(safeGet(stat, ['玩家', '基础', '查克拉上限']), 0);
      const chakraState = currentValue(display, stat, ['玩家', '基础', '查克拉状态'], '未觉醒');
      appendVitalMeter(vitals, {kind: 'chakra', label: '查克拉', current: chakraCurrent, maximum: chakraMaximum, stage: chakraStage(chakraCurrent, chakraMaximum, chakraState), sealed: text(chakraState) === '未觉醒'});
      basic.append(vitals);

      const chips = make('div', 'hz-chip-row');
      const injuries = objectAt(stat, display, ['玩家', '基础', '伤势']);
      Object.entries(injuries).forEach(([id, record]) => {
        const name = currentValue(display, stat, ['玩家', '基础', '伤势', id, '显示名'], id);
        const severity = currentValue(display, stat, ['玩家', '基础', '伤势', id, '严重度'], '');
        chips.append(make('span', 'hz-chip', [name, severity].filter(Boolean).join(' · ')));
      });
      const conditions = objectAt(stat, display, ['玩家', '基础', '异常状态']);
      Object.entries(conditions).forEach(([id, record]) => {
        const name = currentValue(display, stat, ['玩家', '基础', '异常状态', id, '显示名'], id);
        const stage = currentValue(display, stat, ['玩家', '基础', '异常状态', id, '阶段'], '');
        chips.append(make('span', 'hz-chip', [name, stage].filter(Boolean).join(' · ')));
      });
      appendSection(basic, '伤', '伤势与异常', Object.keys(injuries).length + Object.keys(conditions).length);
      basic.append(chips.childElementCount ? chips : make('div', 'hz-empty', '无已知伤势或异常状态'));

      const itemsPanel = panel('items');
      itemsPanel.replaceChildren();
      const itemList = make('div', 'hz-card-list');
      const items = Object.entries(objectAt(stat, display, ['玩家', '物品']));
      appendSection(itemsPanel, '具', '随身携行物', items.length);
      items.slice(0, LIMITS.items).forEach(([id, record]) => {
        const known = Boolean(unwrap(safeGet(stat, ['玩家', '物品', id, '是否已知']), false));
        const name = known ? currentValue(display, stat, ['玩家', '物品', id, '显示名'], '未确认物品') : '未确认物品';
        const quantity = currentValue(display, stat, ['玩家', '物品', id, '数量'], 1);
        const state = currentValue(display, stat, ['玩家', '物品', id, '状态']);
        const description = currentValue(display, stat, ['玩家', '物品', id, '公开描述']);
        appendCard(itemList, name, `数量 ${quantity}`, description, state);
      });
      if (items.length) itemsPanel.append(itemList); else appendEmpty(itemsPanel, '物品栏为空');
      appendMore(itemsPanel, items.length, LIMITS.items);

      const tasksPanel = panel('tasks');
      tasksPanel.replaceChildren();
      const taskList = make('div', 'hz-card-list');
      const tasks = Object.entries(objectAt(stat, display, ['玩家', '任务']));
      appendSection(tasksPanel, '令', '任务卷宗', tasks.length);
      const taskRank = {进行中: 0, 完成: 1, 失败: 2, 放弃: 3};
      tasks.sort((left, right) => {
        const a = text(unwrap(safeGet(left[1], ['状态']), '进行中'));
        const b = text(unwrap(safeGet(right[1], ['状态']), '进行中'));
        return (taskRank[a] ?? 9) - (taskRank[b] ?? 9);
      });
      tasks.slice(0, LIMITS.tasks).forEach(([id, record]) => {
        const name = currentValue(display, stat, ['玩家', '任务', id, '标题'], id);
        const state = currentValue(display, stat, ['玩家', '任务', id, '状态'], '进行中');
        const description = currentValue(display, stat, ['玩家', '任务', id, '公开描述']);
        const objective = currentValue(display, stat, ['玩家', '任务', id, '当前目标']);
        appendCard(taskList, name, state, description, `当前：${objective}`, state);
      });
      if (tasks.length) tasksPanel.append(taskList); else appendEmpty(tasksPanel, '暂无任务');
      appendMore(tasksPanel, tasks.length, LIMITS.tasks);

      const nearbyPanel = panel('nearby');
      nearbyPanel.replaceChildren();
      const nearbyList = make('div', 'hz-card-list');
      const nearby = Object.entries(objectAt(stat, display, ['场景', '附近NPC']));
      appendSection(nearbyPanel, '感', '附近感知记录', nearby.length);
      nearby.slice(0, LIMITS.nearby).forEach(([id, record]) => {
        const name = currentValue(display, stat, ['场景', '附近NPC', id, '显示名'], '未知目标');
        const location = currentValue(display, stat, ['场景', '附近NPC', id, '相对位置']);
        const distance = currentValue(display, stat, ['场景', '附近NPC', id, '距离阶段']);
        const visible = currentValue(display, stat, ['场景', '附近NPC', id, '可见状态']);
        const attitude = currentValue(display, stat, ['场景', '附近NPC', id, '公开态度']);
        const action = currentValue(display, stat, ['场景', '附近NPC', id, '即时动作']);
        appendCard(nearbyList, name, [location, distance].join(' · '), visible, `${attitude}｜${action}`, attitude);
      });
      if (nearby.length) nearbyPanel.append(nearbyList); else appendEmpty(nearbyPanel, '附近没有可观察的 NPC');
      appendMore(nearbyPanel, nearby.length, LIMITS.nearby);

      const relationsPanel = panel('relations');
      relationsPanel.replaceChildren();
      const relationList = make('div', 'hz-card-list');
      const relations = Object.entries(objectAt(stat, display, ['玩家', '关系']));
      appendSection(relationsPanel, '缘', '人物羁绊', relations.length);
      relations.slice(0, LIMITS.relations).forEach(([id, record]) => {
        const name = currentValue(display, stat, ['玩家', '关系', id, '显示名'], id);
        const known = Boolean(unwrap(safeGet(stat, ['玩家', '关系', id, '是否认识']), false));
        const score = unwrap(safeGet(stat, ['玩家', '关系', id, '好感值']), 0);
        const trust = unwrap(safeGet(stat, ['玩家', '关系', id, '信任值']), 0);
        const storedStage = currentValue(display, stat, ['玩家', '关系', id, '关系阶段'], '');
        const stage = storedStage && storedStage !== '暂无' ? storedStage : affectionStage(score);
        const attitude = currentValue(display, stat, ['玩家', '关系', id, '公开态度']);
        const recent = currentValue(display, stat, ['玩家', '关系', id, '最近变化']);
        appendBondMeter(relationList, {name: known ? name : '尚未正式相识', stage, affection: score, trust, attitude, recent});
      });
      if (relations.length) relationsPanel.append(relationList); else appendEmpty(relationsPanel, '尚未建立有意义的关系记录');
      appendMore(relationsPanel, relations.length, LIMITS.relations);
    } catch (error) {
      root.querySelectorAll('[data-panel]').forEach(target => target.replaceChildren(make('div', 'hz-empty', '状态初始化中；请检查 Tavern Helper、MagVarUpdate 与 ST-Prompt-Template。正文不受影响。')));
    }
  })();
  </script>
</div>
